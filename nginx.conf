server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Evaluation invitations are SPA routes, not static files. Keep this
    # location ahead of the generic handler so opening an invitation directly
    # (or refreshing it) always boots React and preserves its query string.
    location ^~ /evaluacion/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
